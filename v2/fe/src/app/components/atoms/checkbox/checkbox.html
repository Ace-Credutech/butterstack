<label class="inline-flex items-center gap-2 cursor-pointer select-none" [class.opacity-50]="disabled()" [class.cursor-not-allowed]="disabled()">
  <span class="relative inline-flex items-center justify-center w-4 h-4 rounded border transition"
        [class.bg-green-600]="checked() || indeterminate()"
        [class.border-green-600]="checked() || indeterminate()"
        [class.bg-white]="!checked() && !indeterminate()"
        [class.border-gray-300]="!checked() && !indeterminate()">
    <input type="checkbox" class="sr-only" [checked]="checked()" [disabled]="disabled()" (change)="toggle()" />
    @if (checked() && !indeterminate()) {
      <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
    }
    @if (indeterminate()) {
      <span class="block w-2 h-0.5 bg-white rounded"></span>
    }
  </span>
  @if (label()) { <span class="text-sm text-gray-700">{{ label() }}</span> }
</label>

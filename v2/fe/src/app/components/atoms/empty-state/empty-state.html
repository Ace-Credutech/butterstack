<div class="flex flex-col items-center justify-center text-center px-6 py-12">
  <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center mb-4">
    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" [attr.d]="icon_path()"/></svg>
  </div>
  <h3 class="text-sm font-semibold text-gray-900 mb-1">{{ title() }}</h3>
  @if (subtitle()) { <p class="text-sm text-gray-500 max-w-sm mb-4">{{ subtitle() }}</p> }
  @if (cta_label()) {
    <button (click)="cta_clicked.emit()" class="text-sm font-medium text-green-600 hover:text-green-700">{{ cta_label() }}</button>
  }
</div>

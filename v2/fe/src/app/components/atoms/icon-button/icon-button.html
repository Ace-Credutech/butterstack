<button type="button" [class]="classes()" [disabled]="disabled()" [attr.aria-label]="label()" [attr.title]="label()" (click)="clicked.emit()">
  <svg [class]="svg_size()" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" [attr.d]="path()"/></svg>
</button>

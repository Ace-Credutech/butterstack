<div class="relative">
  <select
    [ngModel]="value()"
    (ngModelChange)="value.set($event)"
    [disabled]="disabled()"
    class="appearance-none w-full pl-3 pr-9 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
    @if (placeholder()) { <option value="" disabled hidden>{{ placeholder() }}</option> }
    @for (opt of options(); track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
  <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
  </svg>
</div>

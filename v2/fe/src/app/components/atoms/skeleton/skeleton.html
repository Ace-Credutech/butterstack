<span
  class="inline-block bg-gradient-to-r from-gray-100 via-gray-200 to-gray-100 bg-[length:200%_100%] animate-pulse"
  [style.width]="width()"
  [style.height]="height()"
  [class.rounded]="round() === 'sm'"
  [class.rounded-lg]="round() === 'md'"
  [class.rounded-full]="round() === 'full'"
></span>

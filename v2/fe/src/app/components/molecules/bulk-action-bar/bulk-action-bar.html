@if (count() > 0) {
  <div class="sticky top-2 z-20 mx-auto max-w-3xl flex items-center justify-between gap-4 px-4 py-2.5 bg-gray-900 text-white rounded-xl shadow-lg">
    <span class="text-sm font-medium">{{ count() }} selected</span>
    <div class="flex items-center gap-2">
      @for (a of actions(); track a.id) {
        <button type="button" (click)="action_selected.emit(a.id)"
                class="px-3 py-1 text-xs font-medium rounded-md transition"
                [class.bg-white/10]="!a.danger"
                [class.hover:bg-white/20]="!a.danger"
                [class.text-red-300]="a.danger"
                [class.hover:bg-red-500/20]="a.danger">{{ a.label }}</button>
      }
      <button type="button" (click)="cancel_clicked.emit()" class="px-3 py-1 text-xs font-medium rounded-md text-gray-300 hover:text-white hover:bg-white/10 transition">Cancel</button>
    </div>
  </div>
}

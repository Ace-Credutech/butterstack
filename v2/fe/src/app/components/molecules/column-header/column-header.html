<button
  type="button"
  class="inline-flex items-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-gray-500 hover:text-gray-700 transition"
  [class.justify-start]="align() === 'left'"
  [class.justify-end]="align() === 'right'"
  [class.justify-center]="align() === 'center'"
  [class.text-gray-900]="active()"
  [disabled]="!sortable()"
  (click)="clicked.emit()">
  <span>{{ label() }}</span>
  @if (sortable()) {
    <svg class="w-3 h-3 transition" [class.opacity-30]="!active()" [class.rotate-180]="active() && direction() === 'asc'" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
    </svg>
  }
</button>

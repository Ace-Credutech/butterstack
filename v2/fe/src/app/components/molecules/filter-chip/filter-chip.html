<div class="relative inline-block">
  <button type="button" (click)="toggle()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border rounded-lg text-xs font-medium transition"
          [class.border-gray-200]="selected().length === 0"
          [class.text-gray-700]="selected().length === 0"
          [class.border-green-500]="selected().length > 0"
          [class.text-green-700]="selected().length > 0"
          [class.bg-green-50]="selected().length > 0">
    <span>{{ label() }}</span>
    @if (selected().length > 0) {
      <span class="inline-flex items-center justify-center min-w-[16px] h-4 px-1 rounded-full bg-green-600 text-white text-[10px] font-semibold">{{ selected().length }}</span>
    }
    <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-30" (click)="close()"></div>
    <div class="absolute z-40 left-0 mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg py-1 max-h-72 overflow-y-auto">
      <div class="flex items-center justify-between px-3 py-2 text-[11px] font-semibold uppercase tracking-wide text-gray-500 border-b border-gray-100">
        <span>{{ label() }}</span>
        @if (selected().length > 0) {
          <button type="button" (click)="clear_all()" class="text-green-600 hover:text-green-700 normal-case">Clear</button>
        }
      </div>
      @for (opt of options(); track opt.value) {
        <button type="button" (click)="toggle_value(opt.value)" class="w-full flex items-center justify-between gap-2 px-3 py-2 hover:bg-gray-50 transition text-left">
          <span class="flex items-center gap-2 min-w-0">
            <bs-checkbox [checked]="is_selected(opt.value)" (checkedChange)="toggle_value(opt.value)" />
            <span class="text-sm text-gray-700 truncate">{{ opt.label }}</span>
          </span>
          @if (opt.count !== undefined) { <span class="text-xs text-gray-400 shrink-0">{{ opt.count }}</span> }
        </button>
      }
    </div>
  }
</div>

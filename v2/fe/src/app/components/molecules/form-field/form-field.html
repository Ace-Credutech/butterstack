<div>
  <bs-label>{{ label() }}</bs-label>
  <bs-input
    [type]="type()"
    [name]="name()"
    [placeholder]="placeholder()"
    [required]="required()"
    [autocomplete]="autocomplete()"
    [(value)]="value"
  />
  @if (error()) { <p class="mt-1 text-xs text-red-600">{{ error() }}</p> }
</div>

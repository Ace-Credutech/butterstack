<div>
  <bs-label>{{ label() }}</bs-label>
  <div class="relative">
    <input
      [type]="visible() ? 'text' : 'password'"
      [name]="name()"
      [placeholder]="placeholder()"
      [required]="required()"
      [autocomplete]="autocomplete()"
      [attr.minlength]="minlength()"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
      class="w-full px-3.5 py-2.5 pr-14 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition"
    />
    <button type="button" (click)="toggle()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">
      {{ visible() ? 'Hide' : 'Show' }}
    </button>
  </div>
</div>

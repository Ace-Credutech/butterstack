<header class="px-8 py-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <bs-brand-mark theme="dark" />
    @if (auth.authenticated()) {
      <span class="text-gray-200 select-none">/</span>
      <bs-org-switcher />
    }
  </div>

  @if (auth.authenticated()) {
    <div class="flex items-center gap-5">
      <a bsGravity [radius]="120" routerLink="/app/projects"  class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Projects</a>
      <a bsGravity [radius]="120" routerLink="/app/documents" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Documents</a>
      @if (perm.can('admin.users.read')) {
        <a bsGravity [radius]="120" routerLink="/admin/users" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Users</a>
      }
      @if (perm.can('admin.roles.read')) {
        <a bsGravity [radius]="120" routerLink="/admin/roles" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Roles</a>
      }
      @if (perm.can('admin.users.read')) {
        <a bsGravity [radius]="120" routerLink="/admin/prompts" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Prompts</a>
      }
      <bs-user-menu />
    </div>
  } @else {
    <div class="flex items-center gap-4">
      <a bsGravity [radius]="120" routerLink="/login" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition">Sign in</a>
      <a bsGravity routerLink="/register" class="text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg px-4 py-2 transition">Get started</a>
    </div>
  }
</header>

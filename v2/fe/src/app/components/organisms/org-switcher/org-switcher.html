@if (active_org(); as org) {
  <div class="relative">
    <button type="button"
            (click)="toggle()"
            [attr.aria-expanded]="open()"
            aria-haspopup="listbox"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-green-500/40">
      <span class="flex h-5 w-5 items-center justify-center rounded bg-green-600 text-[10px] font-bold text-white uppercase select-none">
        {{ org.name.charAt(0) }}
      </span>
      <span class="max-w-[140px] truncate">{{ org.name }}</span>
      <svg class="w-3 h-3 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    @if (open()) {
      <div role="listbox"
           class="absolute left-0 top-full mt-1.5 w-56 bg-white border border-gray-100 rounded-xl shadow-xl py-1 z-50 origin-top-left animate-in fade-in slide-in-from-top-1 duration-100">
        <p class="px-3 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-gray-400">Organisations</p>
        @for (o of all_orgs(); track o.id) {
          <button type="button"
                  role="option"
                  [attr.aria-selected]="o.id === active_org()?.id"
                  (click)="select(o.id)"
                  class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition text-left">
            <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded bg-green-600 text-[10px] font-bold text-white uppercase">
              {{ o.name.charAt(0) }}
            </span>
            <span class="flex-1 min-w-0">
              <span class="block truncate font-medium">{{ o.name }}</span>
              <span class="block text-[11px] text-gray-400 capitalize">{{ o.type }} · {{ o.my_role }}</span>
            </span>
            @if (o.id === active_org()?.id) {
              <svg class="w-3.5 h-3.5 text-green-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            }
          </button>
        }
      </div>
    }
  </div>
}

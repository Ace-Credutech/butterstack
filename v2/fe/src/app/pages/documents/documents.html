<div class="min-h-screen bg-gray-50">
  <bs-header />

  <main class="max-w-6xl mx-auto px-8 py-8">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Documents</h1>
      <p class="text-sm text-gray-500 mt-1">Files and documents across your workspace.</p>
    </div>

    @if (global.active_org(); as org) {
      <bs-documents-panel
        [org_id]="org.id"
        [user_id]="global.current_user()!.id" />
    } @else {
      <div class="rounded-xl border border-gray-200 bg-white px-6 py-10 text-center">
        <p class="text-sm text-gray-400">No active workspace selected.</p>
      </div>
    }
  </main>
</div>

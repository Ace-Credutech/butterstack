<div class="flex items-center border border-gray-200 rounded-xl px-3 py-2 bg-white">
  @for (step of steps; track step.id; let last = $last) {

    @if (step.id === active) {
      <button class="shrink-0 flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-gradient-to-r from-green-600 to-emerald-500 shadow-md shadow-green-600/30 cursor-pointer select-none transition" (click)="step_click.emit(step.id)">
        <span class="w-7 h-7 rounded-full bg-white/25 text-white flex items-center justify-center text-xs font-semibold shrink-0">{{ step.id }}</span>
        <div class="text-left pr-1">
          <div class="text-[13px] font-semibold text-white leading-tight whitespace-nowrap">{{ step.label }}</div>
          <div class="text-[11px] text-green-200 leading-tight whitespace-nowrap">{{ step.sub }}</div>
        </div>
      </button>
    } @else if (completed.includes(step.id)) {
      <button class="shrink-0 flex items-center gap-2.5 px-4 py-2.5 cursor-pointer select-none hover:bg-gray-50 rounded-full transition" (click)="step_click.emit(step.id)">
        <span class="w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center text-xs shrink-0">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        </span>
        <div class="text-left pr-1">
          <div class="text-[13px] font-medium text-gray-700 leading-tight whitespace-nowrap">{{ step.label }}</div>
          <div class="text-[11px] text-gray-400 leading-tight whitespace-nowrap">{{ step.sub }}</div>
        </div>
      </button>
    } @else {
      <button class="shrink-0 flex items-center gap-2.5 px-4 py-2.5 cursor-pointer select-none hover:bg-gray-50 rounded-full transition" (click)="step_click.emit(step.id)">
        <span class="w-7 h-7 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center text-xs font-semibold shrink-0">{{ step.id }}</span>
        <div class="text-left pr-1">
          <div class="text-[13px] font-medium text-gray-600 leading-tight whitespace-nowrap">{{ step.label }}</div>
          <div class="text-[11px] text-gray-400 leading-tight whitespace-nowrap">{{ step.sub }}</div>
        </div>
      </button>
    }

    @if (!last) {
      @if (completed.includes(step.id)) {
        <div class="flex-1 h-0.5 bg-green-400 mx-2 min-w-[20px]"></div>
      } @else {
        <div class="flex-1 h-0.5 bg-gray-200 mx-2 min-w-[20px]"></div>
      }
    }

  }
</div>

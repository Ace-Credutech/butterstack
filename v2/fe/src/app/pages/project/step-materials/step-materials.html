<div class="space-y-5">
  <div>
    <label class="block text-sm text-gray-600 mb-1.5">Project Brief</label>
    <textarea
      [(ngModel)]="brief"
      placeholder="Describe your project vision, goals, and key requirements..."
      rows="5"
      class="w-full px-3 py-2.5 border border-gray-200 rounded-lg text-sm leading-relaxed placeholder:text-gray-400 focus:outline-none focus:border-green-600 focus:ring-1 focus:ring-green-600 resize-y transition">
    </textarea>
  </div>

  <div>
    <label class="block text-sm text-gray-600 mb-1.5">Upload Materials</label>
    <label class="flex items-center justify-center gap-2 px-4 py-3 border border-dashed border-gray-300 rounded-lg text-sm text-gray-400 cursor-pointer hover:border-green-600 hover:text-green-600 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Click to upload files
      <input type="file" multiple class="hidden" (change)="on_file_select($event)" />
    </label>
  </div>

  @if (files.length) {
    <div class="flex gap-2 flex-wrap">
      @for (file of files; track $index) {
        <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 border border-gray-100 rounded-lg text-xs text-gray-600 group">
          <span class="truncate max-w-[120px]">{{ file.name }}</span>
          <button class="text-gray-300 hover:text-red-500 transition" (click)="remove_file($index)">&times;</button>
        </div>
      }
    </div>
  }
</div>

services:
  butterstack-fe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: butterstack-fe
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - API_URL=${API_URL}
    command: >
      /bin/sh -c "envsubst '$$API_URL' < /etc/nginx/conf.d/default.conf > /tmp/default.conf
      && mv /tmp/default.conf /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

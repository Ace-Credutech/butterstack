<!-- Trigger button -->
<button (click)="toggle()" class="p-1.5 rounded-md hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition" title="Design System">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4.098 19.902a3.75 3.75 0 0 0 5.304 0l6.401-6.402M6.75 21A3.75 3.75 0 0 1 3 17.25V4.125C3 3.504 3.504 3 4.125 3h5.25c.621 0 1.125.504 1.125 1.125v4.072M6.75 21a3.75 3.75 0 0 0 3.75-3.75V8.197M6.75 21h13.125c.621 0 1.125-.504 1.125-1.125v-5.25c0-.621-.504-1.125-1.125-1.125h-4.072M10.5 8.197l2.88-2.88c.438-.439 1.15-.439 1.59 0l3.712 3.713c.44.44.44 1.152 0 1.59l-2.879 2.88M6.75 17.25h.008v.008H6.75v-.008Z"/>
  </svg>
</button>

<!-- Settings panel -->
@if (open()) {
  <div class="fixed inset-0 z-50 flex justify-end" (click)="open.set(false)">
    <div class="w-80 bg-white h-full shadow-2xl border-l border-gray-200 flex flex-col" (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-semibold text-gray-900">Design System</h3>
          <p class="text-[10px] text-gray-400 mt-0.5">Customize prototype appearance</p>
        </div>
        <button (click)="open.set(false)" class="p-1 rounded-md hover:bg-gray-100 text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto px-5 py-4 space-y-6">

        <!-- Color -->
        <div>
          <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-3">Primary Color</label>
          <div class="grid grid-cols-5 gap-2">
            @for (preset of presets; track preset.name) {
              <button (click)="selectPreset(preset)" [title]="preset.name"
                class="w-10 h-10 rounded-lg transition-all flex items-center justify-center"
                [class]="presetBgClass(preset)"
                [style.outline]="isActivePreset(preset) ? '3px solid #111' : 'none'"
                [style.outline-offset]="'2px'">
                @if (isActivePreset(preset)) {
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                  </svg>
                }
              </button>
            }
          </div>
        </div>

        <!-- Border Radius -->
        <div>
          <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-3">Border Radius</label>
          <div class="flex flex-wrap gap-2">
            @for (r of radiusOptions; track r.value) {
              <button (click)="setRadius(r.value)"
                class="px-3 py-1.5 text-xs font-medium border transition"
                [class]="ds().borderRadius === r.value ? 'border-gray-900 bg-gray-900 text-white rounded-md' : 'border-gray-200 text-gray-500 hover:border-gray-300 rounded-md'">
                {{ r.label }}
              </button>
            }
          </div>
        </div>

        <!-- Font -->
        <div>
          <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-3">Font Family</label>
          <div class="space-y-2">
            @for (f of fontOptions; track f.value) {
              <button (click)="setFont(f.value)"
                class="w-full text-left px-3 py-2 border rounded-lg text-sm transition"
                [class]="ds().fontFamily === f.value ? 'border-gray-900 bg-gray-50 text-gray-900 font-medium' : 'border-gray-200 text-gray-500 hover:border-gray-300'">
                <span [class]="f.value">{{ f.label }}</span>
              </button>
            }
          </div>
        </div>

        <!-- JSON preview -->
        <div>
          <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-2">JSON Config</label>
          <pre class="bg-gray-50 border border-gray-200 rounded-lg p-3 text-[10px] text-gray-600 overflow-x-auto">{{ ds() | json }}</pre>
        </div>

      </div>

      <!-- Save -->
      <div class="px-5 py-4 border-t border-gray-200">
        <button (click)="save()" [disabled]="saving()"
          class="w-full py-2.5 bg-gray-900 hover:bg-gray-800 disabled:opacity-50 text-white text-sm font-medium rounded-lg transition">
          {{ saving() ? 'Saving...' : 'Save Design System' }}
        </button>
      </div>

    </div>
  </div>
}

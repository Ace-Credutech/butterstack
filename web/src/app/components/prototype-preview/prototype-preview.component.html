<!-- Header -->
<div class="flex items-center justify-between px-4 py-2.5 bg-white border-b border-gray-100 shrink-0">
  <div class="flex items-center gap-2">
    <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Prototype</span>
    @if (source) {
      <span class="text-xs px-1.5 py-0.5 rounded bg-gray-100 text-gray-400">{{ source }}</span>
    }
  </div>
  <div class="flex items-center gap-2">
    <div class="flex items-center bg-gray-100 rounded-lg p-0.5 gap-0.5">
      @for (vp of ['desktop','tablet','mobile']; track vp) {
        <button
          (click)="setViewport(vp)"
          [class]="viewport === vp
            ? 'px-2 py-1 rounded-md text-xs font-medium text-gray-700 bg-white shadow-sm'
            : 'px-2 py-1 rounded-md text-xs font-medium text-gray-400 hover:text-gray-600'">
          {{ vp[0].toUpperCase() + vp.slice(1) }}
        </button>
      }
    </div>
    <button (click)="copyHtml()" class="text-xs text-gray-400 hover:text-green-600 transition px-2 py-1 rounded-md hover:bg-green-50">
      Copy HTML
    </button>
  </div>
</div>

<!-- Preview area -->
<div class="flex-1 overflow-auto flex items-start justify-center p-6 min-h-0">
  <div
    class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"
    [style.width]="wrapperWidth"
    [style.min-height]="'400px'">

    @if (loading) {
      <div class="flex flex-col items-center justify-center h-96">
        <div class="w-6 h-6 border-2 border-green-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-xs text-gray-400">Generating...</p>
      </div>
    } @else if (safeHtml) {
      <div class="w-full" [innerHTML]="safeHtml"></div>
    } @else {
      <div class="flex flex-col items-center justify-center h-96 text-center p-8">
        <div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center mb-3">
          <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082"/>
          </svg>
        </div>
        <p class="text-sm font-medium text-gray-400">Prototype appears here</p>
        <p class="text-xs text-gray-300 mt-1">Type a title and description on the left</p>
      </div>
    }

  </div>
</div>

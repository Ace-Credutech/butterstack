<!-- Header -->
<div class="flex items-center justify-between px-3 py-2.5 border-b border-gray-100 shrink-0">
  <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">History</span>
  <span class="text-xs text-gray-300">{{ versions.length }} versions</span>
</div>

<div class="px-3 py-2 border-b border-gray-50 shrink-0">
  <span class="text-xs text-gray-400">Requirement Entry</span>
</div>

<!-- Version list -->
<div class="flex-1 overflow-y-auto py-1 min-h-0">
  @if (!versions.length) {
    <div class="flex flex-col items-center justify-center h-32 text-center px-4">
      <p class="text-xs text-gray-300">No versions yet</p>
    </div>
  }
  @for (v of versions; track v.id; let i = $index) {
    <div
      (click)="restore.emit(v)"
      class="flex items-start gap-2 px-3 py-2.5 cursor-pointer rounded-lg mx-1 hover:bg-green-50 transition">
      <div class="flex flex-col items-center mt-1 shrink-0">
        <div class="w-2 h-2 rounded-full" [class]="i === 0 ? 'bg-green-500' : 'bg-gray-200'"></div>
        @if (i < versions.length - 1) {
          <div class="w-px bg-gray-100 mt-1" style="min-height:14px"></div>
        }
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium text-gray-600 truncate">{{ v.label }}</p>
        <p class="text-xs text-gray-300 mt-0.5">v{{ v.id }} · {{ v.time }}</p>
        <p class="text-xs text-gray-300">{{ v.source }}</p>
      </div>
    </div>
  }
</div>

<!-- Meeting -->
<div class="px-3 py-2 border-t border-gray-100 shrink-0">
  <button
    (click)="toggleMeeting.emit()"
    class="w-full flex items-center justify-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg border transition"
    [class]="meetingActive
      ? 'text-red-500 border-red-200 hover:bg-red-50'
      : 'text-gray-500 border-gray-200 hover:border-green-400 hover:text-green-600'">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
    {{ meetingActive ? 'End · ' + meetingTime : 'Start Meeting' }}
  </button>
</div>

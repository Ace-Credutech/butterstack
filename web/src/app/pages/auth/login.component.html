<div class="min-h-screen bg-white flex flex-col">

  <!-- Nav -->
  <header class="flex items-center justify-between px-8 py-5">
    <a routerLink="/" class="flex items-center gap-2.5">
      <div class="w-7 h-7 bg-green-600 rounded-lg flex items-center justify-center">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <span class="font-bold text-gray-900 tracking-tight">butterstack</span>
    </a>
  </header>

  <!-- Form -->
  <main class="flex-1 flex items-center justify-center px-6">
    <div class="w-full max-w-sm">

      <h1 class="text-2xl font-bold text-gray-900 mb-1">Sign in</h1>
      <p class="text-sm text-gray-400 mb-8">Enter your credentials to continue</p>

      @if (error()) {
        <div class="mb-4 px-4 py-2.5 bg-red-50 border border-red-100 rounded-lg text-sm text-red-600">{{ error() }}</div>
      }

      <form (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Email</label>
          <input type="email" [(ngModel)]="email" name="email" required autocomplete="email"
                 class="w-full px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">Password</label>
          <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password"
                 class="w-full px-3.5 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" />
        </div>

        <button type="submit" [disabled]="loading()"
                class="w-full py-2.5 bg-green-600 hover:bg-green-700 disabled:opacity-50 text-white font-semibold rounded-lg transition text-sm">
          {{ loading() ? 'Signing in...' : 'Sign in' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-400">
        Don't have an account?
        <a routerLink="/register" class="text-green-600 font-medium hover:underline">Register</a>
      </p>

    </div>
  </main>

</div>

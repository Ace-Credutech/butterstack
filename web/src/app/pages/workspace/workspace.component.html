<div class="flex flex-col h-screen overflow-hidden font-sans bg-gray-50">

  <!-- Top bar -->
  <header class="h-12 bg-white border-b border-gray-200 flex items-center px-4 gap-4 shrink-0 z-10">
    <div class="flex items-center gap-2 mr-2">
      <div class="w-6 h-6 bg-green-600 rounded-md flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <span class="font-semibold text-sm text-gray-900 tracking-tight">butterstack</span>
    </div>
    <div class="w-px h-5 bg-gray-200"></div>
    <button (click)="goToProjects()" class="text-xs text-gray-400 hover:text-gray-700 transition flex items-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      Projects
    </button>
    <div class="w-px h-5 bg-gray-200"></div>
    <span class="text-xs font-medium text-gray-700">{{ projectName() || '...' }}</span>
    <div class="flex-1"></div>
    <div class="flex items-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full bg-green-500" [class.animate-pulse]="loading()"></div>
      <span class="text-xs text-gray-400">{{ loading() ? 'Generating...' : 'Live' }}</span>
    </div>
    <!-- App fullscreen -->
    <button (click)="toggleAppFullscreen()" class="p-1.5 rounded-md hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition" title="Toggle fullscreen">
      @if (!appFullscreen()) {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
        </svg>
      }
    </button>
    <!-- Input mode toggle -->
    <button (click)="inputMode.set(inputMode() === 'chat' ? 'classic' : 'chat')"
      class="p-1.5 rounded-md hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition"
      [title]="inputMode() === 'chat' ? 'Switch to classic input' : 'Switch to chat'">
      @if (inputMode() === 'chat') {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z"/>
        </svg>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
        </svg>
      }
    </button>
    <app-usage-panel [projectId]="projectId" />
    <app-design-settings [projectId]="projectId" (designSaved)="onDesignSaved()" />
    <app-members-panel [projectId]="projectId" />
    <app-user-avatar />
  </header>

  <!-- Three-column layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left: Modules + History stacked — fixed 240px -->
    <div class="w-60 flex flex-col border-r border-gray-200 shrink-0">

      <app-modules-panel
        class="flex-1 flex flex-col bg-white border-b border-gray-200 min-h-0"
        style="display:flex;flex-direction:column;"
        [approvedVersions]="versions()"
        [projectId]="projectId"
        [projectName]="projectName()"
        (restore)="onRestoreVersion($event)"
        (moduleSelected)="onModuleSelected($event)"
        (featureSelected)="onFeatureSelected($event)"
        (pageSelected)="onPageSelected($event)"
        (projectSelected)="onProjectSelected()"/>

      <app-version-timeline
        class="h-64 flex flex-col bg-white shrink-0"
        style="display:flex;flex-direction:column;"
        [versions]="versions()"
        [meetingActive]="meetingActive()"
        [meetingTime]="meetingTime()"
        (restore)="onRestoreVersion($event)"
        (approve)="onApproveVersion($event)"
        (toggleMeeting)="onToggleMeeting()"/>

    </div>

    <!-- Center: Page selector or Prototype Preview -->
    @if (relatedPages().length > 1) {
      <div class="flex-1 min-w-0 bg-gray-50 flex flex-col">
        <div class="flex items-center px-4 py-2.5 bg-white border-b border-gray-100 shrink-0">
          <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Select a page</span>
          <span class="text-xs text-gray-400 ml-2">{{ selectedContext() }} has {{ relatedPages().length }} pages</span>
        </div>
        <div class="flex-1 overflow-auto p-6">
          <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 max-w-4xl mx-auto">
            @for (p of relatedPages(); track p.id) {
              <button (click)="selectRelatedPage(p)"
                class="bg-white rounded-xl border border-gray-200 p-5 text-left hover:border-green-400 hover:shadow-md transition group cursor-pointer">
                <div class="w-10 h-10 rounded-lg bg-green-50 border border-green-100 flex items-center justify-center mb-3 group-hover:bg-green-100 transition">
                  <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
                  </svg>
                </div>
                <h3 class="text-sm font-semibold text-gray-800 group-hover:text-green-700 transition">{{ p.name }}</h3>
                <span class="text-xs text-gray-400 mt-1">{{ p.pageType }}</span>
              </button>
            }
          </div>
        </div>
      </div>
    } @else {
      <app-prototype-preview
        class="flex flex-col flex-1 min-w-0 bg-gray-50"
        style="display: flex; flex-direction: column;"
        [tokens]="tokens()"
        [loading]="loading()"
        [source]="source()"
        [projectId]="projectId"
        [scopeModuleId]="scopeModuleId()"
        [scopePageId]="scopePageId()"
        [scopeFeatureId]="scopeFeatureId()"/>
    }

    <!-- Right: Chat or Classic Input -->
    @if (inputMode() === 'chat') {
      <app-elicitation-chat
        class="w-96 flex flex-col border-l border-gray-200 bg-white shrink-0"
        style="display:flex;flex-direction:column;"
        [projectId]="projectId"
        (sessionCompleted)="onSessionCompleted($event)"/>
    } @else {
      <app-requirement-input
        class="w-96 flex flex-col border-l border-gray-200 bg-white shrink-0"
        style="display:flex;flex-direction:column;"
        [tokens]="tokens()"
        [cleanPrompt]="cleanPrompt()"
        [projectId]="projectId"
        [restoredTitle]="restoredTitle()"
        [restoredDescription]="restoredDescription()"
        (requirementSaved)="onRequirementSaved($event)"
        (regenerate)="onRegenerate($event)"/>
    }

  </div>
</div>

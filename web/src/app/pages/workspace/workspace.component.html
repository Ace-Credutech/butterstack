<div class="flex flex-col h-screen overflow-hidden font-sans bg-gray-50">

  <!-- Top bar -->
  <header class="h-12 bg-white border-b border-gray-200 flex items-center px-4 gap-4 shrink-0 z-10">
    <div class="flex items-center gap-2 mr-2">
      <div class="w-6 h-6 bg-green-600 rounded-md flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </div>
      <span class="font-semibold text-sm text-gray-900 tracking-tight">butterstack</span>
    </div>
    <div class="w-px h-5 bg-gray-200"></div>
    <button (click)="goToProjects()" class="text-xs text-gray-400 hover:text-gray-700 transition flex items-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
      Projects
    </button>
    <div class="w-px h-5 bg-gray-200"></div>
    <span class="text-xs font-medium text-gray-700">{{ projectName() || '...' }}</span>
    <div class="flex-1"></div>
    <div class="flex items-center gap-1.5">
      <div class="w-1.5 h-1.5 rounded-full bg-green-500" [class.animate-pulse]="loading()"></div>
      <span class="text-xs text-gray-400">{{ loading() ? 'Generating...' : 'Live' }}</span>
    </div>
    <!-- Project Confidence Score Badge -->
    <button (click)="goToConfidence()" class="px-2.5 py-1 rounded-lg hover:bg-gray-100 transition flex items-center gap-1.5" title="Project Confidence">
      <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/>
      </svg>
      <span class="text-[10px] font-semibold text-gray-500">FCS</span>
    </button>
    <!-- App fullscreen -->
    <button (click)="toggleAppFullscreen()" class="p-1.5 rounded-md hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition" title="Toggle fullscreen">
      @if (!appFullscreen()) {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
        </svg>
      }
    </button>
    <app-usage-panel [projectId]="projectId" />
    <app-design-settings [projectId]="projectId" (designSaved)="onDesignSaved()" />
    <app-members-panel [projectId]="projectId" />
    <app-user-avatar />
  </header>

  <!-- Three-column layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left: Modules + History stacked — fixed 240px -->
    <div class="w-60 flex flex-col border-r border-gray-200 shrink-0">

      <app-modules-panel
        class="flex-1 flex flex-col bg-white border-b border-gray-200 min-h-0"
        style="display:flex;flex-direction:column;"
        [approvedVersions]="versions()"
        [projectId]="projectId"
        [projectName]="projectName()"
        (restore)="onRestoreVersion($event)"
        (moduleSelected)="onModuleSelected($event)"
        (featureSelected)="onFeatureSelected($event)"
        (pageSelected)="onPageSelected($event)"
        (projectSelected)="onProjectSelected()"/>

      <app-version-timeline
        class="h-64 flex flex-col bg-white shrink-0"
        style="display:flex;flex-direction:column;"
        [versions]="versions()"
        [meetingActive]="meetingActive()"
        [meetingTime]="meetingTime()"
        (restore)="onRestoreVersion($event)"
        (approve)="onApproveVersion($event)"
        (toggleMeeting)="onToggleMeeting()"/>

    </div>

    <!-- Center: Prototype Preview (always visible — tabs stay) -->
    <app-prototype-preview
      class="flex flex-col flex-1 min-w-0 bg-gray-50"
      style="display: flex; flex-direction: column;"
      [tokens]="tokens()"
      [loading]="loading()"
      [source]="source()"
      [projectId]="projectId"
      [scopeModuleId]="scopeModuleId()"
      [scopePageId]="scopePageId()"
      [scopeFeatureId]="scopeFeatureId()"
      [relatedPages]="relatedPages()"
      [selectedContext]="selectedContext()"
      [detailsModule]="detailsModule()"
      [detailsFeature]="detailsFeature()"
      [moduleFeatures]="moduleFeatures()"
      (pageClicked)="selectRelatedPage($event)"
      (featureClicked)="onDetailsFeatureClicked($event)"
      (quizRequested)="startQuiz($event.featureId, $event.featureName, $event.currentFcs)"
      (tabChanged)="onTabChanged($event)"/>

    <!-- Right: Conversations only -->
    <app-elicitation-chat
      class="w-96 flex flex-col border-l border-gray-200 bg-white shrink-0"
      style="display:flex;flex-direction:column;"
      [projectId]="projectId"
      (sessionCompleted)="onSessionCompleted($event)"/>

  </div>
</div>

<!-- Quiz Modal (full-screen overlay) -->
<app-quiz-modal
  (closed)="onQuizClosed()"
  (scoreUpdated)="onQuizScoreUpdated($event)"/>
